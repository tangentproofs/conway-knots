name = "RationalTangles"
version = "0.1.0"
# Enumerator is the default so `lake build` stays fast (no Mathlib compile).
# Theorem-track: `lake exe cache get && lake build RationalTangles`.
defaultTargets = ["enumerate_knots"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc1"

[[lean_lib]]
name = "RationalTangles"
srcDir = "src"

[[lean_lib]]
name = "ConwayEnumeration"
srcDir = "src"
roots = ["ConwayEnumeration"]

[[lean_exe]]
name = "enumerate_knots"
root = "EnumerateKnots"
